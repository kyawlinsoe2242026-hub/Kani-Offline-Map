<!DOCTYPE html>

<html lang="my"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>KANI OFFLINE MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style> *{box-sizing:border-box} body{ margin:0; background:#101b24; color:white; font-family:Arial,sans-serif; } header{ background:#172b3a; padding:15px; text-align:center; font-size:20px; font-weight:bold; } #map{ height:65vh; width:100%; background:#263746; position:relative; } .controls{ display:flex; flex-wrap:wrap; gap:8px; padding:12px; } button{ border:0; border-radius:7px; padding:12px; background:#1687d9; color:white; font-size:14px; } button:active{ background:#075b99; } .info{ padding:12px; font-size:14px; line-height:1.8; } /* COMPASS */ #compassBox{ position:absolute; top:12px; right:12px; z-index:1000; width:90px; height:110px; background:rgba(16,27,36,0.88); border:2px solid #ffffff; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; } #compassCircle{ width:65px; height:65px; border:2px solid white; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; } #compassNorth{ position:absolute; top:2px; font-size:12px; color:#ff4545; font-weight:bold; } #compassArrow{ font-size:35px; color:#ff4545; transform:rotate(0deg); transition:transform 0.15s linear; } #compassDegree{ font-size:13px; margin-top:4px; } </style>

</head>

<body>

<header>KANI OFFLINE MAP</header>

<div id="map">

<div id="compassBox"> <div id="compassCircle"> <span id="compassNorth">N</span> <span id="compassArrow">▲</span> </div> <div id="compassDegree">--°</div> </div>

</div>

<div class="controls">

<button onclick="getLocation()">📍 My Location</button>

<button onclick="startTracking()">▶ Start Tracking</button>

<button onclick="stopTracking()">⏹ Stop</button>

<button onclick="startCompass()">🧭 Compass ON</button>

<button onclick="stopCompass()">Compass OFF</button>

<button onclick="exportHistory()">📥 Export</button>

<button onclick="clearHistory()">🗑 Clear History</button>

</div>

<div class="info">

<div id="status">GPS: Waiting...</div>

<div id="coordinates">Latitude: -- | Longitude: --</div>

<div id="zoom">Zoom: 13</div>

<div id="historyCount">History: 0</div>

<div id="compassStatus">Compass: Off</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script> const map = L.map('map').setView([22.25,94.85],13); let currentMarker=null; let tracking=false; let watchId=null; let compassRunning=false; let history=JSON.parse( localStorage.getItem('kani_history')||'[]' ); // SATELLITE MAP L.tileLayer( 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { minZoom:2, maxZoom:19, attribution:'Tiles © Esri' } ).addTo(map); // PLACE NAMES AND BOUNDARIES L.tileLayer( 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Esri' } ).addTo(map); // ROADS AND STREET NAMES L.tileLayer( 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Esri' } ).addTo(map); // ZOOM DISPLAY map.on('zoomend',()=>{ document.getElementById('zoom').innerText= 'Zoom: '+map.getZoom(); }); // HISTORY function updateHistoryCount(){ document.getElementById('historyCount').innerText= 'History: '+history.length; } function saveLocation(lat,lon,accuracy){ const item={ latitude:lat, longitude:lon, accuracy:accuracy, time:new Date().toISOString() }; history.push(item); localStorage.setItem( 'kani_history', JSON.stringify(history) ); updateHistoryCount(); } // SHOW GPS LOCATION function showLocation(lat,lon,accuracy){ document.getElementById('coordinates').innerText= 'Latitude: '+lat.toFixed(6)+ ' | Longitude: '+lon.toFixed(6); document.getElementById('status').innerText= 'GPS Accuracy: '+accuracy+' m'; if(currentMarker){ currentMarker.setLatLng([lat,lon]); }else{ currentMarker=L.marker([lat,lon]) .addTo(map) .bindPopup('Your Location'); } map.setView([lat,lon],16); if(tracking){ saveLocation(lat,lon,accuracy); } } // ANDROID GPS CONNECTION window.onNativeLocation=function(lat,lon,accuracy){ showLocation(lat,lon,accuracy); }; // GET LOCATION function getLocation(){ if(window.AndroidGPS){ AndroidGPS.getLocation(); return; } if(!navigator.geolocation){ alert('GPS မရရှိနိုင်ပါ'); return; } navigator.geolocation.getCurrentPosition( position=>{ showLocation( position.coords.latitude, position.coords.longitude, position.coords.accuracy ); }, error=>alert('GPS Error: '+error.message), {enableHighAccuracy:true} ); } // START TRACKING function startTracking(){ tracking=true; if(window.AndroidGPS){ AndroidGPS.startTracking(); }else if(navigator.geolocation){ watchId=navigator.geolocation.watchPosition( position=>{ showLocation( position.coords.latitude, position.coords.longitude, position.coords.accuracy ); }, error=>alert(error.message), {enableHighAccuracy:true} ); } document.getElementById('status').innerText= 'Tracking Started'; } // STOP TRACKING function stopTracking(){ tracking=false; if(window.AndroidGPS){ AndroidGPS.stopTracking(); } if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } document.getElementById('status').innerText= 'Tracking Stopped'; } // COMPASS function updateCompass(event){ let heading=null; // iPhone compass if(event.webkitCompassHeading!==undefined){ heading=event.webkitCompassHeading; }else if(event.alpha!==null){ heading=360-event.alpha; // Correct screen rotation if(screen.orientation && screen.orientation.angle!==undefined){ heading+=screen.orientation.angle; } } if(heading===null || !Number.isFinite(heading)){ return; } heading=((heading%360)+360)%360; document.getElementById('compassArrow').style.transform= 'rotate('+heading+'deg)'; document.getElementById('compassDegree').innerText= Math.round(heading)+'°'; document.getElementById('compassStatus').innerText= 'Compass: Active'; } // START COMPASS async function startCompass(){ if(!window.DeviceOrientationEvent){ alert('ဒီဖုန်းမှာ Compass Sensor မရရှိနိုင်ပါ'); return; } // iPhone permission if(typeof DeviceOrientationEvent.requestPermission==='function'){ try{ const permission= await DeviceOrientationEvent.requestPermission(); if(permission!=='granted'){ alert('Compass Permission မရရှိပါ'); return; } }catch(error){ alert('Compass Permission Error'); return; } } window.addEventListener( 'deviceorientation', updateCompass, true ); window.addEventListener( 'deviceorientationabsolute', updateCompass, true ); compassRunning=true; document.getElementById('compassStatus').innerText= 'Compass: Starting...'; } // STOP COMPASS function stopCompass(){ window.removeEventListener( 'deviceorientation', updateCompass, true ); window.removeEventListener( 'deviceorientationabsolute', updateCompass, true ); compassRunning=false; document.getElementById('compassDegree').innerText='--°'; document.getElementById('compassArrow').style.transform= 'rotate(0deg)'; document.getElementById('compassStatus').innerText= 'Compass: Off'; } // EXPORT HISTORY function exportHistory(){ const data=JSON.stringify(history,null,2); const blob=new Blob( [data], {type:'application/json'} ); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='kani-location-history.json'; a.click(); URL.revokeObjectURL(url); } // CLEAR HISTORY function clearHistory(){ if(confirm('History အားလုံးဖျက်မှာ သေချာပါသလား?')){ history=[]; localStorage.removeItem('kani_history'); updateHistoryCount(); } } updateHistoryCount(); </script>

</body> </html>
