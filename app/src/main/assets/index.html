<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANI OFFLINE MAP</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#101b24;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:#172b3a;
 padding:15px;
 text-align:center;
 font-size:20px;
 font-weight:bold;
}

#map{
 height:65vh;
 width:100%;
 background:#263746;
}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:12px;
}

button{
 border:0;
 border-radius:7px;
 padding:12px;
 background:#1687d9;
 color:white;
 font-size:14px;
}

.info{
 padding:12px;
 font-size:14px;
 line-height:1.8;
}
</style>
</head>

<body>

<header>KANI OFFLINE MAP</header>

<div id="map"></div>

<div class="controls">
<button onclick="getLocation()">📍 My Location</button>
<button onclick="startTracking()">▶ Start Tracking</button>
<button onclick="stopTracking()">⏹ Stop</button>
<button onclick="exportHistory()">📥 Export</button>
<button onclick="clearHistory()">🗑 Clear History</button>
</div>

<div class="info">
<div id="status">GPS: Waiting...</div>
<div id="coordinates">Latitude: -- | Longitude: --</div>
<div id="zoom">Zoom: 13</div>
<div id="historyCount">History: 0</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([22.25,94.85],13);

let currentMarker=null;
let tracking=false;
let watchId=null;

let history=JSON.parse(
 localStorage.getItem('kani_history')||'[]'
);

L.tileLayer(
 'tiles/{z}/{x}/{y}.jpg',
 {
  minZoom:13,
  maxZoom:19,
  attribution:'KANI OFFLINE MAP'
 }
).addTo(map);

map.on('zoomend',()=>{
 document.getElementById('zoom').innerText=
 'Zoom: '+map.getZoom();
});

function updateHistoryCount(){
 document.getElementById('historyCount').innerText=
 'History: '+history.length;
}

function saveLocation(lat,lon,accuracy){
 const item={
  latitude:lat,
  longitude:lon,
  accuracy:accuracy,
  time:new Date().toISOString()
 };

 history.push(item);

 localStorage.setItem(
  'kani_history',
  JSON.stringify(history)
 );

 updateHistoryCount();
}

function showLocation(lat,lon,accuracy){

 document.getElementById('coordinates').innerText=
 'Latitude: '+lat.toFixed(6)+
 ' | Longitude: '+lon.toFixed(6);

 document.getElementById('status').innerText=
 'GPS Accuracy: '+accuracy+' m';

 if(currentMarker){
  currentMarker.setLatLng([lat,lon]);
 }else{
  currentMarker=L.marker([lat,lon])
   .addTo(map)
   .bindPopup('Your Location');
 }

 map.setView([lat,lon],16);

 if(tracking){
  saveLocation(lat,lon,accuracy);
 }
}

window.onNativeLocation=function(lat,lon,accuracy){
 showLocation(lat,lon,accuracy);
};

function getLocation(){

 if(window.AndroidGPS){
  AndroidGPS.getLocation();
  return;
 }

 if(!navigator.geolocation){
  alert('GPS မရရှိနိုင်ပါ');
  return;
 }

 navigator.geolocation.getCurrentPosition(
  position=>{
   showLocation(
    position.coords.latitude,
    position.coords.longitude,
    position.coords.accuracy
   );
  },
  error=>alert('GPS Error: '+error.message),
  {enableHighAccuracy:true}
 );
}

function startTracking(){

 tracking=true;

 if(window.AndroidGPS){
  AndroidGPS.startTracking();
 }else if(navigator.geolocation){

  watchId=navigator.geolocation.watchPosition(
   position=>{
    showLocation(
     position.coords.latitude,
     position.coords.longitude,
     position.coords.accuracy
    );
   },
   error=>alert(error.message),
   {enableHighAccuracy:true}
  );
 }

 document.getElementById('status').innerText=
 'Tracking Started';
}

function stopTracking(){

 tracking=false;

 if(window.AndroidGPS){
  AndroidGPS.stopTracking();
 }

 if(watchId!==null){
  navigator.geolocation.clearWatch(watchId);
  watchId=null;
 }

 document.getElementById('status').innerText=
 'Tracking Stopped';
}

function exportHistory(){

 const data=JSON.stringify(history,null,2);

 const blob=new Blob(
  [data],
  {type:'application/json'}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement('a');
 a.href=url;
 a.download='kani-location-history.json';
 a.click();

 URL.revokeObjectURL(url);
}

function clearHistory(){

 if(confirm('History အားလုံးဖျက်မှာ သေချာပါသလား?')){

  history=[];

  localStorage.removeItem('kani_history');

  updateHistoryCount();
 }
}

updateHistoryCount();

</script>

</body>
</html>
